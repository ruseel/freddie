[package]
name = "freddie"
description = "freddie: a framework for typed event-to-state machines (work in progress; name reservation)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bind = { path = "../bind", version = "0.0.1", default-features = false }
freddie_keys = { path = "../freddie_keys", version = "0.0.1" }
freddie_timer = { path = "../freddie_timer", version = "0.0.1", features = ["bind"] }

[features]
# Test-only equality on timer firings and effects, so it stays out of the normal build.
testing = ["freddie_timer/testing"]

[lints]
workspace = true
